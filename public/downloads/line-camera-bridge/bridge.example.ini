# Copy to bridge.ini and fill in for your line. Everything here can also be
# passed as a --flag instead; a flag always overrides the same setting here.
[bridge]

# One of:
#   rtsp://192.168.1.50:554/stream1      an IP camera / CCTV encoder
#   http://192.168.1.50/video.mjpg       an HTTP MJPEG camera
#   0                                    a USB webcam attached to this PC (device index)
#   /path/to/clip.mp4                    a video file, for a dry run before wiring a camera
source = rtsp://192.168.1.50:554/stream1

# https://zemainspect.vercel.app, or your own deployment's URL.
base_url = https://zemainspect.vercel.app

# Dashboard > API keys > Create key. Issue one key per line PC, not one
# shared across the plant — revoking a compromised station then never stops
# the rest of the factory.
api_key = zi_live_...

# Free-form; shown in the dashboard feed and trends exactly as typed here.
line_id = PRESS-SHOP-1

# steel (default), general, automotive.
product_category = steel

# Seconds between inspections. A camera streams at 15-30fps; nothing about a
# production line needs, or a plan's quota can absorb, an inspection at that
# rate. Every frame in between is read and discarded so the capture buffer
# never serves a stale frame.
interval_seconds = 5.0

# 1 to archive the frame with each inspection (needed to review a failure
# later), 0 to skip storage on a very high-volume line.
store_image = 1
